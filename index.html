<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="AirSonka photography portfolio">
  <title>AirSonka</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand-lockup" href="#selected" aria-label="AirSonka home">
    <span class="brand">AirSonka</span>
    <span class="brand-tagline" id="brandTagline">Photos for a softer world.</span>
  </a>
  <button class="menu-toggle" type="button" aria-label="Toggle navigation">Menu</button>
  <nav class="nav" aria-label="Main navigation">
    <a data-route="selected" href="#selected">Selected</a>
    <a data-route="collections" href="#collections">Collections</a>
    <a data-route="all" href="#all">All Photos</a>
    <a data-route="about" href="#about">About</a>
    <a data-route="contact" href="#contact">Contact</a>
  </nav>
</header>
<main id="app" class="app"><div class="loading">Loading AirSonka…</div></main>
<footer class="site-footer"><span id="footerText">© AirSonka</span></footer>
<dialog id="lightbox" class="lightbox">
  <button class="lightbox-close" type="button" aria-label="Close">×</button>
  <button class="lightbox-prev" type="button" aria-label="Previous photo">‹</button>
  <div class="lightbox-inner">
    <div class="lightbox-media"><img id="lightboxImage" alt=""></div>
    <aside class="lightbox-info" id="lightboxInfo"></aside>
  </div>
  <button class="lightbox-next" type="button" aria-label="Next photo">›</button>
</dialog>
<script src="data/site.js"></script>
<script src="data/photos.js"></script>
<script src="app.js"></script>
</body>
</html>
